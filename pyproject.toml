[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-egress-sentinel"
version = "0.1.0"
description = "Autonomous AI Agent Network Egress Sentinel, Domain Sniffer & Endpoint Telemetry Monitor"
readme = "README.md"
authors = [{ name = "Neal Frazier", email = "neal@nullai.tech" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
agent-egress = "agent_egress_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
